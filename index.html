<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nani Drama App</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial}
header{padding:18px;text-align:center;background:#1d1d1d;color:#ff477e;font-size:25px;font-weight:bold}
.feed{height:75vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.video{background:#242424;border-radius:18px;padding:35px;width:100%;max-width:400px}
.video h2{color:#ff477e}
nav{position:fixed;bottom:0;background:#222;width:100%;display:flex;justify-content:space-around;padding:18px}
button{background:#ff477e;color:white;border:0;padding:12px 20px;border-radius:25px}
</style>
</head>
<body>
<header>❤️ Nani Drama</header>
<div class="feed">
<div class="video">
<h2>Welcome to Nani Drama App</h2>
<p>Share your videos and enjoy amazing dramas!</p>
<button onclick="alert('Video upload feature coming soon!')">＋ Upload Video</button>
</div>
</div>
<nav>
<span>🏠 Home</span>
<span>🔍 Search</span>
<span>➕ Upload</span>
<span>👤 Profile</span>
</nav>
</body>
</html>
